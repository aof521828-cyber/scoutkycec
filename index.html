<script>
/* ===================================================================
   Backend bridge: google.script.run (Apps Script page), fetch to the Apps Script API (GitHub Pages), or in-memory demo
   =================================================================== */
const GAS_RUN = typeof google !== 'undefined' && google.script && google.script.run;
const API_URL = (window.SCOUT_CONFIG && window.SCOUT_CONFIG.apiUrl) || '';
const IS_GAS = !!(GAS_RUN || API_URL);
const STATUSES = ['มา', 'ขาด', 'ลา', 'สาย'];
const SHORT = { 'มา': 'ม', 'ขาด': 'ข', 'ลา': 'ล', 'สาย': 'ส' };
const ROLE_LABEL = { admin: 'ผู้ดูแลระบบ', leader: 'หัวหน้าลูกเสือ', dept: 'ครูประจำแผนก', squad: 'ครูผู้กำกับหมู่' };
const ROLE_HELP = {
  admin: 'เช็คชื่อได้ทุกแผนก ทุกหมู่ แก้ครั้งที่ปิดแล้วได้ และจัดการหลังบ้าน',
  leader: 'เช็คชื่อได้ทุกแผนก ทุกหมู่ และแก้ครั้งที่ปิดแล้วได้',
  dept: 'เช็คชื่อได้เฉพาะแผนกที่ดูแล ในครั้งที่เปิดเช็คชื่อ',
  squad: 'เช็คชื่อได้เฉพาะหมู่ที่ดูแล ในครั้งที่เปิดเช็คชื่อ'
};
function checkAll(u) { return !!u && (u.role === 'admin' || u.role === 'leader'); }
function canCheck(u, s) {
  if (checkAll(u)) return true;
  if (u.role === 'dept') return (u.classes || []).includes(String(s.class_code));
  if (u.role === 'squad') return (u.squads || []).includes(Number(s.squad_no));
  return false;
}

function api(fn, ...args) {
  if (!GAS_RUN && API_URL) {
    const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctl && ctl.abort(), 60000);
    return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json())
      .catch(() => { throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจลิงก์ apiUrl ใน config.js และอินเทอร์เน็ต'); })
      .then(j => { clearTimeout(timer); if (!j.ok) throw new Error(j.error); return j.data; });
  }
  if (GAS_RUN) {
    return new Promise((res, rej) => {
      // never hang on "กำลังโหลด": give up after 40 s with a readable message
      const timer = setTimeout(() => rej(new Error('เซิร์ฟเวอร์ไม่ตอบกลับภายใน 40 วินาที (' + fn + ') ลองรีเฟรชหน้า หรือตรวจว่าทำให้ใช้งานได้เป็นเวอร์ชันล่าสุดแล้ว')), 40000);
      google.script.run
        .withSuccessHandler(v => { clearTimeout(timer); if (v === null && fn !== 'logout') rej(new Error('เซิร์ฟเวอร์ส่งข้อมูลกลับมาไม่ได้ (' + fn + ')')); else res(v); })
        .withFailureHandler(e => { clearTimeout(timer); rej(e); })[fn](...args);

/* ===================================================================
   Statistics
   =================================================================== */
function computeStats(d) {
  const st = d.settings, pass = st.pass_percent / 100;
  const active = d.sessions.filter(s => !s.cancelled);
  const bySession = {};
  d.attendance.forEach(a => { if (!a.status) return; (bySession[a.session_id] = bySession[a.session_id] || {})[a.student_id] = a; });
  const held = active.filter(s => bySession[s.session_id] && Object.keys(bySession[s.session_id]).length);
  const remaining = active.filter(s => !held.includes(s));
  const students = d.students.filter(s => s.status !== 'ลาออก');
  const rows = students.map(s => {
    const c = { 'มา': 0, 'ขาด': 0, 'ลา': 0, 'สาย': 0, none: 0 };
    held.forEach(se => { const a = bySession[se.session_id][s.student_id]; a ? c[a.status]++ : c.none++; });
    const ok = c['มา'] + (st.count_late_as_present ? c['สาย'] : 0);
    const total = held.length + remaining.length;
    const rate = held.length ? ok / held.length : 0;
    const allowedMiss = total - Math.ceil(total * pass);
    const missed = held.length - ok;
    const left = allowedMiss - missed;
    const maxRate = total ? (ok + remaining.length) / total : 0;
    let level = 'ok';
    if (held.length && maxRate < pass) level = 'out';
    else if (held.length && rate < pass) level = 'below';
    else if (held.length && left <= 1) level = 'watch';
    return { s, c, ok, rate, left, maxRate, level };
  });
  const sessionRates = held.map(se => {
    const m = bySession[se.session_id]; const n = students.length;
    const c = { 'มา': 0, 'ขาด': 0, 'ลา': 0, 'สาย': 0 }; Object.values(m).forEach(a => c[a.status] = (c[a.status] || 0) + 1);
    const ok = c['มา'] + (st.count_late_as_present ? c['สาย'] : 0);
    return { se, c, rate: n ? ok / n : 0 };
  });
  const group = key => {
    const g = {}; rows.forEach(r => { const k = r.s[key] === '' ? '-' : r.s[key]; (g[k] = g[k] || []).push(r); });
    return Object.entries(g).map(([k, rs]) => ({ key: k, n: rs.length, avg: rs.reduce((a, r) => a + r.rate, 0) / rs.length, below: rs.filter(r => r.level === 'below' || r.level === 'out').length, rows: rs }));
  };
  const avg = rows.length ? rows.reduce((a, r) => a + r.rate, 0) / rows.length : 0;
  return { pass, active, held, remaining, rows, sessionRates, avg, byClass: group('class_short').sort((a, b) => String(a.key).localeCompare(b.key)), bySquad: group('squad_no').sort((a, b) => String(a.key).localeCompare(String(b.key))), bySession };
}
const LEVEL = { ok: ['ok', 'ผ่านเกณฑ์'], watch: ['warn', 'เฝ้าระวัง'], below: ['bad', 'ต่ำกว่าเกณฑ์'], out: ['bad', 'ไม่ผ่านแน่นอน'] };

  { id: 'check', label: 'เช็คชื่อ' },

  { id: 'admin', label: 'หลังบ้าน', admin: true }
];
function renderTabs() {
  $('#tabs').innerHTML = VIEWS.filter(v => v.pub || (S.user && (!v.admin || S.user.role === 'admin')))
    .map(v => `<a href="#${v.id}" ${S.view === v.id ? 'aria-current="page"' : ''}>${v.label}</a>`).join('');
  $('#userBtn').textContent = S.user ? `${S.user.name || S.user.email} ▾` : 'เข้าสู่ระบบครู';
}
async function go(view) {
  if (dirtyCount() && S.view === 'check' && view !== 'check') {
    if (!(await ask('มีการเช็คชื่อที่ยังไม่บันทึก ออกจากหน้านี้หรือไม่', 'ออกโดยไม่บันทึก'))) { setHash('check'); return; }
    S.check.dirty = {};
  }
  const v = VIEWS.find(x => x.id === view);
  if (view !== 'login' && (!v || (!v.pub && !S.user))) view = S.user ? 'dash' : (view === 'lookup' || !v ? 'lookup' : 'login');
  if (v && v.admin && S.user && S.user.role !== 'admin') view = 'dash';
  S.view = view;
  setHash(view);
  renderTabs();
  $('#savebarHost').innerHTML = '';
  try {
    if (view === 'login') return renderLogin();
    if (view === 'lookup') return renderLookup();
    if (!S.data) await loadTerm();
    if (!S.data) {
      if (view === 'admin' && S.user && S.user.role === 'admin') { if (S.adminTab !== 'db' && S.adminTab !== 'users') S.adminTab = 'db'; return renderAdmin(); }
      if (S.token) $('#main').innerHTML = `<section class="view"><div class="notice">${esc(S.loadError || 'โหลดข้อมูลภาคเรียนไม่สำเร็จ')}</div>
        <div class="row">${S.user && S.user.role === 'admin' ? '<a class="btn primary" href="#admin">ไปที่หลังบ้าน</a>' : ''}<button class="btn" type="button" onclick="location.reload()">โหลดใหม่</button></div></section>`;
      return;
    }
    ({ dash: renderDash, check: renderCheck, status: renderStatus, risk: renderRisk, grid: renderGrid, admin: renderAdmin })[view]();
  } catch (e) { showFatal(e); }
}
// Apps Script runs the page in a sandboxed frame where history/hash calls can be refused, so they are optional
function setHash(view) { try { if (location.hash.slice(1) !== view) history.replaceState(null, '', '#' + view); } catch (e) {} }
function showFatal(e) {
  const m = (e && (e.message || e.reason && e.reason.message)) || String(e);
  $('#main').innerHTML = `<div class="notice"><b>หน้าเว็บทำงานผิดพลาด</b><br>${esc(m)}<br><span class="small">ถ้าแจ้งปัญหา ให้คัดลอกข้อความนี้ส่งมาด้วย</span><div style="margin-top:8px"><button class="btn" type="button" onclick="location.reload()">โหลดใหม่</button></div></div>`;
}
window.addEventListener('error', e => { if ($('#main .spinner')) showFatal(e.error || e.message); });
window.addEventListener('unhandledrejection', e => { if ($('#main .spinner')) showFatal(e.reason); });
window.addEventListener('hashchange', () => go(location.hash.slice(1) || 'lookup'));
// menu links: navigate directly instead of relying on hash changes inside the Apps Script frame
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const id = a.getAttribute('href').slice(1); if (!VIEWS.some(v => v.id === id)) return;
  e.preventDefault(); go(id);
});
window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });

function setToken(t, user) { S.token = t; S.user = user || null; S.data = null; store.set('scout_tok', t ? JSON.stringify({ t, user }) : null); }

async function loadTerm() {
  if (!S.token || !S.term) return;
  $('#main').innerHTML = '<div class="spinner">กำลังโหลดข้อมูลภาคเรียน…</div>';
  S.loadError = '';
  try { S.data = await api('getTermData', S.token, S.term.academic_year, S.term.semester); S.user = S.data.user; S.stats = computeStats(S.data); }
  catch (e) {
    const m = e && e.message || String(e);
    S.loadError = m.replace(/^NOT_CONNECTED:/, '');
    if (!/^NOT_CONNECTED:/.test(m)) fail(e);
  }
}

function lookupHTML(r) {
  const s = r.student, st = r.settings;

    const d = { settings: st, students: [s], sessions: ses, attendance: r.attendance };
    const x = computeStats(d); const row = x.rows[0];
    if (!x.held.length || !row) return '';
    const [y, sem] = k.split('-');
    const dots = ses.filter(v => !v.cancelled).sort((a, b) => a.week - b.week).map(se => {
      const a = (x.bySession[se.session_id] || {})[s.student_id];
      const held = x.held.includes(se);
      return `<span class="cell ${a ? 'c-' + a.status : 'c-none'}" title="สัปดาห์ ${se.week} · ${thDate(se.date)} · ${a ? a.status : held ? 'ไม่มีบันทึก' : 'ยังไม่ถึง'}">${a ? SHORT[a.status] : held ? '?' : se.week}</span>`;
    }).join('');
    const [cls, lab] = LEVEL[row.level];
    return `<div class="panel grid"><div class="head"><h3>ภาคเรียน ${sem}/${y}</h3><span class="pill ${cls}">${lab}</span></div>
      <div class="kpis"><div class="kpi"><div class="label">เข้าร่วม</div><div class="val">${pct(row.rate)}</div><div class="sub">เกณฑ์ ${st.pass_percent}%</div></div>
      <div class="kpi"><div class="label">มา / สาย</div><div class="val">${row.c['มา']} / ${row.c['สาย']}</div><div class="sub">จาก ${x.held.length} ครั้งที่จัดแล้ว</div></div>
      <div class="kpi"><div class="label">ขาด / ลา</div><div class="val">${row.c['ขาด']} / ${row.c['ลา']}</div><div class="sub">${row.left >= 0 ? 'ขาดได้อีกไม่เกิน ' + row.left + ' ครั้ง' : 'ขาดเกินที่กำหนด ' + (-row.left) + ' ครั้ง'}</div></div></div>
      <div class="bar ${barCls(row.rate, x.pass)}"><i style="width:${(row.rate * 100).toFixed(1)}%"></i></div>
      <div class="dots">${dots}</div></div>`;
  }).join('');
  return `<div class="view"><div class="panel"><div class="head"><h3>${esc(s.full_name)}</h3><button class="btn primary" type="button" data-pdf>ดาวน์โหลด PDF</button></div><div class="row small muted">
    <span class="num">รหัส ${esc(s.student_id)}</span><span>· ${esc(s.class_short)}</span><span>· หมู่ ${esc(s.squad_no || '-')}</span>${s.role !== 'สมาชิก' ? `<span class="tag lead">${esc(s.role)}</span>` : ''}</div></div>
    ${blocks || '<div class="panel empty">ยังไม่มีการเช็คชื่อ</div>'}
    <div class="chips small"><span class="chip c-มา">ม = มา</span><span class="chip c-ขาด">ข = ขาด</span><span class="chip c-ลา">ล = ลา</span><span class="chip c-สาย">ส = สาย</span><span class="chip c-none">ตัวเลข = สัปดาห์ที่ยังไม่ถึง</span></div></div>`;
}

      <div class="kpi ${below.length ? 'alert' : ''}"><div class="label">ต่ำกว่าเกณฑ์ ${st.pass_percent}%</div><div class="val">${below.length}</div><div class="sub">เฝ้าระวังอีก ${watch.length} คน</div></div>
    </div>
    <div class="panel chart"><div class="head"><h3>อัตราเข้าร่วมรายสัปดาห์</h3><span class="small muted">เส้นประ = เกณฑ์ ${st.pass_percent}%</span></div>${weekChart(x, st)}</div>
    <div class="grid cols-2">
      <div class="panel grid"><h3>แยกตามแผนก</h3>${groupTable(x.byClass, 'แผนก', x)}</div>
      <div class="panel grid"><h3>แยกตามหมู่</h3>${groupTable(x.bySquad, 'หมู่', x, true)}</div>
    </div>
    <div class="panel grid"><div class="head"><h3>ต้องติดตาม</h3><a class="btn" href="#risk">ดูทั้งหมด</a></div>
      ${below.length + watch.length ? riskTable([...below, ...watch].sort((a, b) => a.rate - b.rate).slice(0, 8), x) : '<p class="empty">ทุกคนผ่านเกณฑ์</p>'}</div>
  </section>`;
}
function weekChart(x, st) {
  const ses = x.active; if (!ses.length) return '<p class="empty">ยังไม่มีครั้งกิจกรรม</p>';
  const W = 760, H = 220, L = 34, R = 8, T = 12, B = 30, n = ses.length, bw = (W - L - R) / n;
  const y = v => T + (H - T - B) * (1 - v);
  const rates = {}; x.sessionRates.forEach(r => rates[r.se.session_id] = r.rate);
  let g = '';
  [0, .25, .5, .75, 1].forEach(v => g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v * 100}</text>`);
  ses.forEach((se, i) => {
    const cx = L + i * bw + bw / 2, r = rates[se.session_id];
    if (r !== undefined) { const c = r < x.pass ? 'var(--bad)' : 'var(--accent)'; g += `<rect x="${cx - bw * .32}" y="${y(r)}" width="${bw * .64}" height="${y(0) - y(r)}" rx="3" fill="${c}"><title>สัปดาห์ ${se.week} · ${thDate(se.date)} · ${pct(r)}</title></rect>`; }
    else g += `<rect x="${cx - bw * .32}" y="${y(0) - 3}" width="${bw * .64}" height="3" rx="1.5" fill="var(--line)"/>`;
    g += `<text x="${cx}" y="${H - 10}" text-anchor="middle">${se.week}</text>`;
  });
  g += `<line x1="${L}" x2="${W - R}" y1="${y(x.pass)}" y2="${y(x.pass)}" stroke="var(--scarf)" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="อัตราเข้าร่วมรายสัปดาห์">${g}</svg><div class="small muted" style="text-align:center">สัปดาห์ที่</div>`;
}
function groupTable(groups, label, x, squad) {
  return `<div class="tbl-wrap"><table><thead><tr><th>${label}</th><th class="r">คน</th><th>เฉลี่ย</th><th class="r">ต่ำกว่าเกณฑ์</th></tr></thead><tbody>${groups.map(g => {
    const lead = squad ? g.rows.find(r => r.s.role === 'นายหมู่') : null;
    return `<tr><td>${squad ? (g.key === '-' ? 'ไม่มีหมู่' : 'หมู่ ' + esc(g.key)) : esc(g.key)}${lead ? `<div class="small muted">นายหมู่ ${esc(lead.s.first_name)}</div>` : ''}</td><td class="r num">${g.n}</td>
      <td style="min-width:140px"><div class="row" style="flex-wrap:nowrap"><div class="bar ${barCls(g.avg, x.pass)}" style="flex:1"><i style="width:${(g.avg * 100).toFixed(1)}%"></i></div><span class="num small">${x.held.length ? pct(g.avg) : '-'}</span></div></td>
      <td class="r num">${g.below ? `<span class="pill bad">${g.below}</span>` : '<span class="muted">0</span>'}</td></tr>`; }).join('')}</tbody></table></div>`;
}

/* ---------- risk ---------- */
function riskTable(rows, x) {
  return `<div class="tbl-wrap"><table><thead><tr><th>นักเรียน</th><th>แผนก</th><th class="c">หมู่</th><th class="r">มา</th><th class="r">สาย</th><th class="r">ลา</th><th class="r">ขาด</th><th>เข้าร่วม</th><th class="r">ขาดได้อีก</th><th>สถานะ</th></tr></thead><tbody>${rows.map(r => {
    const [cls, lab] = LEVEL[r.level];
    return `<tr><td><b style="font-weight:500">${esc(r.s.full_name)}</b><div class="small muted num">${esc(r.s.student_id)}</div></td><td>${esc(r.s.class_short)}</td><td class="c">${esc(r.s.squad_no || '-')}</td>
      <td class="r num">${r.c['มา']}</td><td class="r num">${r.c['สาย']}</td><td class="r num">${r.c['ลา']}</td><td class="r num">${r.c['ขาด'] + r.c.none}</td>
      <td style="min-width:130px"><div class="row" style="flex-wrap:nowrap"><div class="bar ${barCls(r.rate, x.pass)}" style="flex:1"><i style="width:${(r.rate * 100).toFixed(1)}%"></i></div><span class="num small">${pct(r.rate)}</span></div></td>
      <td class="r num">${r.left >= 0 ? r.left : `<span style="color:var(--bad)">เกิน ${-r.left}</span>`}</td><td><span class="pill ${cls}">${lab}</span></td></tr>`; }).join('')}</tbody></table></div>`;
}
function renderRisk() {
  const x = S.stats, st = S.data.settings;
  const f = S.riskFilter;
  let rows = x.rows.slice().sort((a, b) => a.rate - b.rate);
  if (f === 'below') rows = rows.filter(r => r.level === 'below' || r.level === 'out');
  if (f === 'watch') rows = rows.filter(r => r.level !== 'ok');
  const counts = { all: x.rows.length, below: x.rows.filter(r => r.level === 'below' || r.level === 'out').length, watch: x.rows.filter(r => r.level !== 'ok').length };
  $('#main').innerHTML = `<section class="view">
    ${headHTML('นักเรียนที่ขาดเกินเกณฑ์', `เกณฑ์ผ่าน ${st.pass_percent}% ของ ${x.active.length} ครั้งในภาคเรียน · จัดแล้ว ${x.held.length} ครั้ง เหลือ ${x.remaining.length} ครั้ง · “ขาดได้อีก” คิดจากทั้งภาคเรียน`,
      `<button class="btn" type="button" id="riskCsv">${IS_GAS ? 'ดาวน์โหลด CSV' : 'คัดลอก CSV'}</button>${PDF_BTN}`)}
    <div class="subtabs no-print">${[['below', 'ต่ำกว่าเกณฑ์'], ['watch', 'ต่ำกว่าเกณฑ์ + เฝ้าระวัง'], ['all', 'ทุกคน']].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${f === k}">${l} (${counts[k]})</button>`).join('')}</div>
    ${rows.length ? riskTable(rows, x) : '<div class="panel empty">ไม่มีนักเรียนในกลุ่มนี้</div>'}
    <p class="small muted">ไม่ผ่านแน่นอน = แม้มาครบทุกครั้งที่เหลือก็ไม่ถึงเกณฑ์ · เฝ้าระวัง = ผ่านอยู่แต่ขาดได้อีกไม่เกิน 1 ครั้ง · ครั้งที่ไม่มีบันทึกนับเป็นขาด</p>

    </tbody></table></div>
    <div class="panel grid"><div class="head"><h3>ภาพรวมทั้งภาคเรียน</h3><span class="small muted">ช่องละ 1 สัปดาห์ · ตัวเลข = เช็คแล้วกี่ %</span></div>
    <div class="tbl-wrap" style="border:0"><table class="matrix"><thead><tr><th class="name">${st.by === 'class' ? 'แผนก' : 'หมู่'}</th>${d.sessions.map(s => `<th title="${thDate(s.date)}">${s.week}</th>`).join('')}<th>ค้าง</th></tr></thead><tbody>
    ${groups.map(g => { let owe = 0; const cells = d.sessions.map(s => { const p = progress(g, s.session_id); const [cls] = state(p, s);
        if (cls === 'bad' || cls === 'warn') owe++;
        const bg = cls === 'ok' ? 'c-มา' : cls === 'warn' ? 'c-สาย' : cls === 'bad' ? 'c-ขาด' : 'c-none';
        return `<td><span class="cell ${bg}" style="width:34px" title="สัปดาห์ ${s.week} · ${p.done}/${p.n}">${s.cancelled ? 'งด' : s.date > today && !p.done ? '' : p.n ? Math.round(p.done / p.n * 100) : '-'}</span></td>`; }).join('');

    </tbody></table></div>

  }
  $('#main').innerHTML = `<section class="view">
    ${headHTML('สถานะการเช็คชื่อ', 'ดูว่าแผนกหรือหมู่ไหนเช็คชื่อแล้ว ใครเป็นผู้บันทึก และยังค้างอยู่กี่ครั้ง', PDF_BTN)}

      <label class="field" style="flex:1 1 240px">ครั้งกิจกรรม<select id="stSes">${d.sessions.map(s => `<option value="${s.session_id}" ${s.session_id === st.sid ? 'selected' : ''}>สัปดาห์ ${s.week} · ${thDate(s.date)}${s.cancelled ? ' · งด' : ''}</option>`).join('')}</select></label>
      <div class="field">แยกตาม<div class="seg" role="group">${[['class', 'แผนก'], ['squad', 'หมู่']].map(([k, l]) => `<button type="button" data-by="${k}" aria-pressed="${st.by === k}">${l}</button>`).join('')}</div></div>
    </div>${body}</section>`;
  $('#stSes').onchange = e => { st.sid = e.target.value; renderStatus(); };
  document.querySelectorAll('[data-by]').forEach(b => b.onclick = () => { st.by = b.dataset.by; renderStatus(); });
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {
    S.check.sid = st.sid; S.check.dirty = {};
    if (st.by === 'class') { S.check.scope = 'class'; S.check.cls = b.dataset.goto; } else { S.check.scope = 'squad'; S.check.squad = b.dataset.goto; }
    go('check');

}

    </tbody></table></div></div>
</div>`;

  $('#openAll').onclick = () => setAll(true); $('#closeAll').onclick = () => setAll(false);
}

function sheetLink(sh) {
  if (!sh || !sh.title) return '';

}

      <td class="r num">${t.students ?? '-'}</td><td class="r num">${t.sessions ?? '-'}</td><td class="r num">${t.records ?? '-'}</td><td>${pill(t)}</td>

function adminImport() {
  $('#adminBody').innerHTML = `<form class="panel grid" id="impForm"><h3>นำเข้ารายชื่อจากการคัดลอก</h3>
    <p class="small muted" style="margin:0">คัดลอกจาก Excel หรือ Google Sheet วางได้เลย 1 บรรทัดต่อ 1 คน เรียงคอลัมน์: <b>รหัส · คำนำหน้า · ชื่อ · นามสกุล · รหัสกลุ่มเรียน · หมู่ · ตำแหน่ง</b> (หมู่และตำแหน่งเว้นได้) รหัสที่มีอยู่แล้วจะถูกอัปเดต</p>
    <textarea id="impText" rows="9" class="inp" placeholder="70201010001	นาย	สมชาย	ใจดี	702010101	1	นายหมู่"></textarea>
    <div id="impPrev"></div>
    <div class="row"><button class="btn" type="button" id="impCheck">ตรวจสอบ</button><button class="btn primary" type="submit" id="impGo" disabled>นำเข้า</button></div></form>`;
  let parsed = [];
  const parse = () => {
    const rows = $('#impText').value.split(/\r?\n/).map(l => l.split(/\t|,/).map(v => v.trim())).filter(r => r[0]);
    parsed = rows.map(r => ({ student_id: r[0], prefix: r[1] || '', first_name: r[2] || '', last_name: r[3] || '', class_code: r[4] || '', squad_no: r[5] || '', role: r[6] || 'สมาชิก' }));
    const bad = parsed.filter(p => !/^\d{6,15}$/.test(p.student_id) || !p.first_name);
    const known = new Set(S.data.classes.map(c => c.class_code));
    const unk = parsed.filter(p => p.class_code && !known.has(p.class_code));
    $('#impPrev').innerHTML = `<div class="notice ${bad.length ? '' : 'info'}">พบ ${parsed.length} คน${bad.length ? ` · รูปแบบผิด ${bad.length} บรรทัด (เช่น ${esc(bad[0].student_id)})` : ''}${unk.length ? ` · ไม่รู้จักรหัสกลุ่มเรียน ${esc([...new Set(unk.map(u => u.class_code))].join(', '))} (เพิ่มได้ที่แท็บตั้งค่า)` : ''}</div>`;
    $('#impGo').disabled = !parsed.length || bad.length > 0;
  };
  $('#impCheck').onclick = parse; $('#impText').oninput = () => { $('#impGo').disabled = true; };
  $('#impForm').onsubmit = async e => { e.preventDefault(); try { const r = await api('importStudents', S.token, S.term.academic_year, S.term.semester, parsed); toast(`เพิ่มใหม่ ${r.added} · อัปเดต ${r.updated} คน`); await reloadTerm(); S.adminTab = 'students'; renderAdmin(); } catch (err) { fail(err); } };
}
async function adminUsers() {

      <label class="field">สิทธิ์<select id="uR">${['dept', 'leader', 'squad', 'admin'].map(r => `<option value="${r}" ${(u?.role || 'dept') === r ? 'selected' : ''}>${ROLE_LABEL[r]}</option>`).join('')}</select></label>
      <label class="field">สถานะ<select id="uA"><option value="1" ${u?.active !== false ? 'selected' : ''}>ใช้งาน</option><option value="0" ${u?.active === false ? 'selected' : ''}>ระงับ</option></select></label></div>
      <p class="small" id="uHelp" style="margin:0"></p>
      <fieldset id="uClsBox" class="panel" style="padding:10px 12px"><legend class="small muted">แผนกที่ดูแล</legend><div class="row">${allClasses.map(c => `<label class="row small"><input type="checkbox" value="${esc(c.class_code)}" ${String(u?.classes || '').split(',').includes(c.class_code) ? 'checked' : ''}> ${esc(c.class_short)} ${esc(c.class_name)}</label>`).join('')}</div></fieldset>
      <label class="field" id="uSqBox">หมู่ที่ดูแล (เช่น 1,2)<input id="uS" value="${esc(u?.squads || '')}"></label>
      <label class="field">${u ? 'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่าน (อย่างน้อย 6 ตัว)'}<input id="uP" type="password" minlength="6" ${u ? '' : 'required'} autocomplete="new-password"></label>
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="uC">ยกเลิก</button><button class="btn primary" type="submit">บันทึก</button></div></form>`, m => {
    const sync = () => { const r = m.querySelector('#uR').value; m.querySelector('#uHelp').textContent = ROLE_HELP[r]; m.querySelector('#uClsBox').hidden = r !== 'dept'; m.querySelector('#uSqBox').hidden = r !== 'squad'; };
    m.querySelector('#uR').onchange = sync; sync();
    m.querySelector('#uC').onclick = closeModal;
    m.querySelector('#uForm').onsubmit = async e => { e.preventDefault();
      const o = { email: m.querySelector('#uE').value.trim(), name: m.querySelector('#uN').value.trim(), role: m.querySelector('#uR').value, squads: m.querySelector('#uS').value.trim(),
        classes: [...m.querySelectorAll('#uClsBox input:checked')].map(i => i.value).join(','), active: m.querySelector('#uA').value === '1', password: m.querySelector('#uP').value };
      try { await api('saveUser', S.token, o); closeModal(); toast('บันทึกผู้ใช้ ' + o.email + ' แล้ว'); adminUsers(); } catch (err) { fail(err); } };
  });
  const scope = u => u.role === 'dept' ? String(u.classes || '').split(',').filter(Boolean).map(c => esc(className(c))).join(', ') || '<span style="color:var(--bad)">ยังไม่เลือกแผนก</span>'
    : u.role === 'squad' ? 'หมู่ ' + esc(u.squads) : '<span class="muted">ทุกแผนก ทุกหมู่</span>';
  $('#adminBody').innerHTML = `<div class="grid"><div class="row" style="justify-content:space-between"><span class="small muted">ครูประจำแผนกเช็คได้เฉพาะแผนกของตัวเอง · หัวหน้าลูกเสือเช็คได้ทั้งหมด</span><button class="btn primary" type="button" id="addU">เพิ่มผู้ใช้</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>ขอบเขตการเช็คชื่อ</th><th>สถานะ</th><th></th></tr></thead><tbody>
    ${users.map((u, i) => `<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td><span class="tag ${u.role === 'leader' || u.role === 'admin' ? 'lead' : ''}">${ROLE_LABEL[u.role] || esc(u.role)}</span></td><td>${scope(u)}</td>
      <td>${!u.has_password ? '<span class="pill warn">ยังไม่ตั้งรหัส</span>' : u.active ? '<span class="pill ok">ใช้งาน</span>' : '<span class="pill off">ระงับ</span>'}</td><td><button class="btn" type="button" data-u="${i}">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></div>`;
  $('#addU').onclick = () => form(null);
  document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => form(users[+b.dataset.u]));
}
function adminSettings() {
  const st = S.boot.settings, d = { classes: (S.data && S.data.classes) || S.boot.classes || [] };
  $('#adminBody').innerHTML = `<div class="grid cols-2"><form class="panel grid" id="setForm"><h3>เกณฑ์และการแสดงผล</h3>
    <label class="field">ชื่อสถานศึกษา<input id="sSchool" value="${esc(st.school_name)}"></label>

    <div class="panel grid"><h3>กลุ่มเรียน / แผนก</h3><div class="tbl-wrap"><table><thead><tr><th>รหัสกลุ่ม</th><th>ชื่อย่อ</th><th>สาขา</th></tr></thead><tbody>${d.classes.map(c => `<tr><td class="num">${esc(c.class_code)}</td><td>${esc(c.class_short)}</td><td>${esc(c.class_name)}</td></tr>`).join('')}</tbody></table></div>
    <form id="clsForm" class="form-grid"><label class="field">รหัสกลุ่ม<input id="cC" inputmode="numeric" required></label><label class="field">ชื่อย่อ<input id="cS" placeholder="ชย.1" required></label><label class="field">สาขา<input id="cN" required></label><div class="field">&nbsp;<button class="btn" type="submit">เพิ่ม/แก้ไข</button></div></form></div></div>`;
  $('#setForm').onsubmit = async e => { e.preventDefault(); const [s, y] = $('#sTerm').value.split('/').map(Number);
    const o = { school_name: $('#sSchool').value, activity_name: $('#sAct').value, pass_percent: +$('#sPass').value, count_late_as_present: $('#sLate').checked, public_lookup: $('#sPub').checked, academic_year: y, semester: s };
    try { const r = await api('saveSettings', S.token, o); S.boot.settings = Object.assign(S.boot.settings, r); if (S.data) { S.data.settings = S.boot.settings; S.stats = computeStats(S.data); } applyBrand(); toast('บันทึกการตั้งค่าแล้ว'); } catch (err) { fail(err); } };
  $('#clsForm').onsubmit = async e => { e.preventDefault(); const o = { class_code: $('#cC').value.trim(), class_short: $('#cS').value.trim(), class_name: $('#cN').value.trim(), level: 'ปวช.1' };
    try { await api('saveClass', S.token, o); toast('บันทึกกลุ่มเรียน ' + o.class_short + ' แล้ว'); await refreshBoot(); if (S.data) await reloadTerm(); renderAdmin(); } catch (err) { fail(err); } };
}

/* ===================================================================
   Boot
   =================================================================== */
function applyBrand() { const st = S.boot.settings; $('#schoolName').textContent = [st.school_name, st.activity_name].filter(Boolean).join(' · '); try { document.title = 'เช็คชื่อลูกเสือ ' + st.school_name; } catch (e) {} }
function fillTerms() {
  $('#termSel').innerHTML = S.boot.terms.map(t => `<option value="${termLabel(t)}">${termLabel(t)}${t.connected ? '' : ' (ยังไม่เชื่อมต่อ)'}</option>`).join('');
  if (S.term) $('#termSel').value = termLabel(S.term);
}
$('#termSel').onchange = async e => {
  if (dirtyCount() && !(await ask('มีการเช็คชื่อที่ยังไม่บันทึก เปลี่ยนภาคเรียนหรือไม่', 'ทิ้งการแก้ไข'))) { e.target.value = termLabel(S.term); return; }
  S.check.dirty = {}; S.check.sid = null;
  const [s, y] = e.target.value.split('/').map(Number); S.term = { academic_year: y, semester: s }; pref.set('scout_term', e.target.value);
  S.data = null; go(S.view === 'login' ? 'lookup' : S.view);
};
$('#userBtn').onclick = userMenu;

(async function start() {
 try {
  if (!IS_GAS) $('#demoFlag').hidden = false;
  try { S.boot = await api('getBoot'); } catch (e) { $('#main').innerHTML = `<div class="notice">เชื่อมต่อฐานข้อมูลไม่ได้: ${esc(e.message || e)}</div>`; return; }
  const st = S.boot.settings;
  const saved = pref.get('scout_term');
  const want = S.boot.terms.find(t => termLabel(t) === saved) || S.boot.terms.find(t => t.academic_year === st.academic_year && t.semester === st.semester) || S.boot.terms[0];
  S.term = want || { academic_year: st.academic_year, semester: st.semester };
  fillTerms(); applyBrand();
  try { const tok = JSON.parse(store.get('scout_tok') || 'null'); if (tok) { S.token = tok.t; S.user = tok.user; } } catch (e) {}
  if (!IS_GAS && !S.token) { const r = Demo.login('admin', 'demo1234'); S.token = r.token; S.user = r.user; S.term = { academic_year: 2569, semester: 1 }; fillTerms(); }
  let first = ''; try { first = location.hash.slice(1); } catch (e) {}
  await go(first || (S.user ? 'dash' : 'lookup'));
 } catch (e) { showFatal(e); }
})();
